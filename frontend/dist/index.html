<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Obsidian Agent Workspace</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Marked Markdown Parser & Highlight.js -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            vault: {
              bg: '#1e1e24',
              surface: '#26262e',
              border: '#33333f',
              accent: '#7c3aed',
              text: '#e2e8f0',
              muted: '#94a3b8'
            }
          }
        }
      }
    }
  </script>
  <style>
    /* 自定义滚动条与编辑器字体 */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #1e1e24; }
    ::-webkit-scrollbar-thumb { background: #3f3f4e; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #5a5a70; }
    .mono-font { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .markdown-body h1 { font-size: 1.8rem; font-weight: 700; margin: 1.2rem 0 0.6rem; color: #f1f5f9; border-bottom: 1px solid #33333f; padding-bottom: 0.3rem; }
    .markdown-body h2 { font-size: 1.4rem; font-weight: 600; margin: 1rem 0 0.5rem; color: #e2e8f0; border-bottom: 1px solid #2a2a38; padding-bottom: 0.2rem; }
    .markdown-body h3 { font-size: 1.2rem; font-weight: 600; margin: 0.8rem 0 0.4rem; color: #cbd5e1; }
    .markdown-body p { margin-bottom: 0.8rem; line-height: 1.7; color: #cbd5e1; }
    .markdown-body ul { list-style-type: disc; margin-left: 1.5rem; margin-bottom: 0.8rem; }
    .markdown-body ol { list-style-type: decimal; margin-left: 1.5rem; margin-bottom: 0.8rem; }
    .markdown-body blockquote { border-left: 3px solid #7c3aed; padding-left: 1rem; color: #94a3b8; font-style: italic; margin: 0.8rem 0; }
    .markdown-body code { background: #2a2a36; padding: 0.2rem 0.4rem; border-radius: 4px; font-size: 0.88em; color: #f472b6; font-family: monospace; }
    .markdown-body pre code { background: transparent; padding: 0; color: inherit; }
    .markdown-body table { width: 100%; border-collapse: collapse; margin: 1rem 0; }
    .markdown-body th, .markdown-body td { border: 1px solid #3f3f4e; padding: 6px 12px; }
    .markdown-body th { background: #262630; }
    .wikilink { color: #a78bfa; background: #3b2d54; padding: 1px 6px; border-radius: 4px; text-decoration: none; border-bottom: 1px dashed #7c3aed; }
    .wikilink:hover { color: #c4b5fd; background: #4c3870; }
  </style>
</head>
<body class="bg-[#18181b] text-slate-200 h-screen flex flex-col select-none overflow-hidden font-sans">

  <!-- 顶部导航栏 -->
  <header class="h-12 bg-[#202024] border-b border-[#2e2e38] flex items-center justify-between px-4 z-10 shrink-0">
    <div class="flex items-center space-x-3">
      <div class="flex items-center text-purple-400 font-bold text-sm tracking-wide">
        <i data-lucide="brain" class="w-5 h-5 mr-2"></i>
        <span>Obsidian Agent Workspace</span>
      </div>
      <span class="text-xs bg-[#2e2e3a] text-purple-300 px-2 py-0.5 rounded border border-purple-800/40">P0 Demo</span>
      <span id="vault-path-badge" class="text-xs text-slate-400 hidden sm:inline-block max-w-xs truncate border-l border-slate-700 pl-3">连接中...</span>
    </div>

    <div class="flex items-center space-x-4 text-xs">
      <div class="flex items-center space-x-2 text-slate-400">
        <span>笔记: <b id="stat-files" class="text-slate-200">-</b></span>
        <span>·</span>
        <span>标签: <b id="stat-tags" class="text-slate-200">-</b></span>
        <span>·</span>
        <span class="flex items-center text-emerald-400"><i data-lucide="radio" class="w-3 h-3 mr-1 animate-pulse"></i>Watchdog 增量</span>
      </div>
      <button id="btn-new-file" class="bg-purple-600 hover:bg-purple-500 text-white px-3 py-1 rounded flex items-center transition shadow-sm">
        <i data-lucide="plus" class="w-3.5 h-3.5 mr-1"></i>新建笔记
      </button>
    </div>
  </header>

  <!-- 主体三栏布局 -->
  <div class="flex-1 flex overflow-hidden">
    
    <!-- 左栏：文件树 -->
    <aside class="w-72 bg-[#1c1c20] border-r border-[#2e2e38] flex flex-col shrink-0">
      <!-- 搜索框 -->
      <div class="p-2 border-b border-[#2a2a34]">
        <div class="relative">
          <i data-lucide="search" class="w-4 h-4 absolute left-2.5 top-2.5 text-slate-400"></i>
          <input id="file-search" type="text" placeholder="搜索 2400+ 篇笔记..." 
                 class="w-full bg-[#27272e] text-xs text-slate-200 pl-8 pr-3 py-2 rounded focus:outline-none focus:ring-1 focus:ring-purple-500 border border-[#373744]">
        </div>
      </div>
      <!-- 文件树列表 -->
      <div id="file-tree-container" class="flex-1 overflow-y-auto p-2 text-xs">
        <div class="text-slate-500 text-center py-8">正在读取本地 Vault 索引...</div>
      </div>
    </aside>

    <!-- 中间栏：Markdown 编辑器与渲染区 -->
    <main class="flex-1 flex flex-col bg-[#18181b] overflow-hidden">
      <!-- 文件操作顶栏 -->
      <div id="editor-header" class="h-10 bg-[#222228] border-b border-[#2e2e38] flex items-center justify-between px-4 shrink-0">
        <div class="flex items-center space-x-3 overflow-hidden">
          <i data-lucide="file-text" class="w-4 h-4 text-purple-400 shrink-0"></i>
          <span id="current-file-path" class="text-xs text-slate-300 font-mono truncate">未选择文件</span>
          <!-- 状态胶囊 -->
          <div id="status-badge-container" class="hidden items-center space-x-1">
            <span class="text-[10px] text-slate-500">状态:</span>
            <select id="select-status" class="bg-[#2d2d38] text-xs text-purple-200 border border-purple-900/50 rounded px-1.5 py-0.5 focus:outline-none">
              <option value="未整理">未整理</option>
              <option value="进行中">进行中</option>
              <option value="已完成">已完成</option>
              <option value="已整理">已整理</option>
              <option value="未开始">未开始</option>
            </select>
          </div>
        </div>

        <!-- 视图切换与保存 -->
        <div id="editor-actions" class="flex items-center space-x-2 hidden">
          <div class="bg-[#2a2a34] p-0.5 rounded flex items-center text-xs">
            <button id="view-edit" class="px-2 py-0.5 rounded bg-purple-600 text-white flex items-center">
              <i data-lucide="edit-3" class="w-3 h-3 mr-1"></i>编辑
            </button>
            <button id="view-preview" class="px-2 py-0.5 rounded text-slate-400 hover:text-white flex items-center">
              <i data-lucide="eye" class="w-3 h-3 mr-1"></i>渲染
            </button>
            <button id="view-split" class="px-2 py-0.5 rounded text-slate-400 hover:text-white flex items-center">
              <i data-lucide="columns" class="w-3 h-3 mr-1"></i>双栏
            </button>
          </div>
          <button id="btn-save" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-3 py-1 rounded flex items-center transition shadow-sm">
            <i data-lucide="save" class="w-3.5 h-3.5 mr-1"></i>保存 (⌘S)
          </button>
        </div>
      </div>

      <!-- 409 冲突警告条 -->
      <div id="conflict-alert" class="hidden bg-amber-900/80 border-b border-amber-600 px-4 py-2 text-xs flex items-center justify-between text-amber-200">
        <div class="flex items-center space-x-2">
          <i data-lucide="alert-triangle" class="w-4 h-4 text-amber-400 shrink-0"></i>
          <span><b>并发冲突：</b>该文件已被外部（Obsidian 或其它工具）修改！为保护资产，已阻止保存覆盖。</span>
        </div>
        <button id="btn-reload-conflict" class="bg-amber-700 hover:bg-amber-600 text-white px-2.5 py-0.5 rounded text-xs">
          重新载入最新版本
        </button>
      </div>

      <!-- 编辑/预览主体区 -->
      <div class="flex-1 flex overflow-hidden relative">
        <!-- 编辑文本框 -->
        <div id="edit-pane" class="flex-1 h-full flex flex-col overflow-hidden">
          <textarea id="markdown-editor" 
                    placeholder="选择左侧文件开始浏览或编辑..."
                    class="w-full h-full bg-[#18181b] text-slate-200 p-6 mono-font text-sm leading-relaxed resize-none focus:outline-none border-none overflow-y-auto selection:bg-purple-900 selection:text-purple-100"></textarea>
        </div>
        <!-- 预览面板 -->
        <div id="preview-pane" class="flex-1 h-full bg-[#1c1c22] border-l border-[#2e2e38] overflow-y-auto p-8 markdown-body hidden">
          <div id="markdown-preview" class="max-w-3xl mx-auto"></div>
        </div>
      </div>
    </main>

    <!-- 右栏：标签与知识结构分析 -->
    <aside class="w-80 bg-[#1e1e24] border-l border-[#2e2e38] flex flex-col shrink-0">
      <div class="h-10 border-b border-[#2e2e38] px-4 flex items-center justify-between text-xs text-slate-300 font-semibold bg-[#222228]">
        <div class="flex items-center space-x-1.5">
          <i data-lucide="tags" class="w-4 h-4 text-purple-400"></i>
          <span>标签中心 (Tags)</span>
        </div>
        <span id="active-tag-badge" class="text-[10px] text-purple-300 bg-purple-950/80 px-2 py-0.5 rounded border border-purple-800/50 hidden">全部</span>
      </div>

      <!-- 标签筛选结果展示 -->
      <div id="tag-filter-view" class="p-3 border-b border-[#2c2c38] bg-[#24242c] hidden">
        <div class="flex items-center justify-between mb-2">
          <span class="text-xs font-bold text-purple-300 flex items-center">
            <i data-lucide="filter" class="w-3 h-3 mr-1"></i><span id="current-tag-name"></span>
          </span>
          <button id="btn-clear-tag" class="text-[10px] text-slate-400 hover:text-slate-200">清除筛选</button>
        </div>
        <!-- 状态分布微缩栏 -->
        <div id="tag-status-pills" class="flex flex-wrap gap-1 mb-2"></div>
        <!-- 该标签下的笔记列表 -->
        <div id="tag-files-list" class="max-h-56 overflow-y-auto space-y-1 text-xs pr-1"></div>
      </div>

      <!-- 全局标签库（按热度排列） -->
      <div class="flex-1 overflow-y-auto p-3">
        <div class="text-[11px] text-slate-400 font-semibold mb-2 uppercase tracking-wider">高频知识标签</div>
        <div id="tags-cloud" class="flex flex-wrap gap-1.5">
          <div class="text-slate-500 text-xs py-4">正在统计知识标签...</div>
        </div>
      </div>
    </aside>

  </div>

  <!-- 新建笔记 Modal 弹窗 -->
  <div id="modal-new-file" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
    <div class="bg-[#24242c] border border-[#383848] w-full max-w-lg rounded-lg shadow-2xl p-5 space-y-4">
      <div class="flex items-center justify-between border-b border-[#333342] pb-3">
        <h3 class="text-sm font-bold text-slate-100 flex items-center">
          <i data-lucide="file-plus" class="w-4 h-4 mr-2 text-purple-400"></i>新建笔记
        </h3>
        <button id="btn-close-modal" class="text-slate-400 hover:text-slate-200"><i data-lucide="x" class="w-4 h-4"></i></button>
      </div>

      <!-- Tab 切换 -->
      <div class="flex border-b border-[#333342] text-xs">
        <button id="tab-create-tpl" class="pb-2 px-3 border-b-2 border-purple-500 text-purple-300 font-semibold flex items-center">
          <i data-lucide="sparkles" class="w-3.5 h-3.5 mr-1"></i>使用 Obsidian 模板
        </button>
        <button id="tab-create-blank" class="pb-2 px-3 text-slate-400 hover:text-slate-200 flex items-center">
          <i data-lucide="file" class="w-3.5 h-3.5 mr-1"></i>空白笔记
        </button>
      </div>

      <!-- 模板创建视图 -->
      <div id="view-tpl-create" class="space-y-3">
        <div>
          <label class="block text-xs text-slate-300 mb-1">选择 Obsidian 模板</label>
          <select id="select-template" class="w-full bg-[#18181b] text-xs text-slate-200 p-2.5 rounded border border-[#3c3c4e] focus:outline-none focus:ring-1 focus:ring-purple-500">
            <option value="">正在加载模板...</option>
          </select>
        </div>
        <div>
          <label class="block text-xs text-slate-300 mb-1">笔记标题 (Title)</label>
          <input id="input-tpl-title" type="text" placeholder="例如: 图神经网络实战笔记"
                 class="w-full bg-[#18181b] text-xs text-slate-200 p-2.5 rounded border border-[#3c3c4e] focus:outline-none focus:ring-1 focus:ring-purple-500 font-medium">
        </div>
        <!-- 建议路径提示 -->
        <div class="bg-[#1c1c22] p-2.5 rounded border border-[#2e2e3a] text-[11px] text-slate-300 flex items-start space-x-2">
          <i data-lucide="folder-output" class="w-4 h-4 text-purple-400 shrink-0 mt-0.5"></i>
          <div>
            <div class="text-slate-400">自动计算落位路径:</div>
            <div id="tpl-suggested-path" class="font-mono text-purple-200 break-all mt-0.5">-</div>
          </div>
        </div>
        <!-- JS 降级提醒 -->
        <div id="tpl-js-warning" class="hidden bg-amber-950/40 border border-amber-800/60 p-2.5 rounded text-[11px] text-amber-200 flex items-center space-x-2">
          <i data-lucide="info" class="w-4 h-4 text-amber-400 shrink-0"></i>
          <span>包含 Templater JS 动态代码块：创建时将完整保留并在 Obsidian 中执行。</span>
        </div>
      </div>

      <!-- 空白笔记视图 -->
      <div id="view-blank-create" class="space-y-3 hidden">
        <div>
          <label class="block text-xs text-slate-300 mb-1">笔记相对路径 (含 .md)</label>
          <input id="input-new-path" type="text" placeholder="例如: 07.学习笔记/Agent探索.md"
                 class="w-full bg-[#18181b] text-xs text-slate-200 p-2.5 rounded border border-[#3c3c4e] focus:outline-none focus:ring-1 focus:ring-purple-500 font-mono">
        </div>
        <div>
          <label class="block text-xs text-slate-300 mb-1">初始正文 / Frontmatter</label>
          <textarea id="input-new-content" rows="4"
                    class="w-full bg-[#18181b] text-xs text-slate-200 p-2 rounded border border-[#3c3c4e] focus:outline-none focus:ring-1 focus:ring-purple-500 font-mono"># 新笔记</textarea>
        </div>
      </div>

      <div class="flex justify-end space-x-2 pt-2 border-t border-[#333342]">
        <button id="btn-cancel-create" class="px-3 py-1.5 rounded text-xs text-slate-400 hover:bg-[#30303c]">取消</button>
        <button id="btn-confirm-create" class="px-4 py-1.5 rounded text-xs bg-purple-600 hover:bg-purple-500 text-white font-medium flex items-center">
          <i data-lucide="check" class="w-3.5 h-3.5 mr-1"></i>创建文件
        </button>
      </div>
    </div>
  </div>

  <!-- 主业务脚本 -->
  <script>
    // 全局状态管理
    const state = {
      config: null,
      treeData: null,
      currentPath: null,
      currentHash: null,
      currentRaw: '',
      currentStatus: null,
      activeTag: null,
      viewMode: 'split' // 'edit', 'preview', 'split'
    };

    // DOM 元素引用
    const el = {
      vaultPath: document.getElementById('vault-path-badge'),
      statFiles: document.getElementById('stat-files'),
      statTags: document.getElementById('stat-tags'),
      treeContainer: document.getElementById('file-tree-container'),
      fileSearch: document.getElementById('file-search'),
      currentFilePath: document.getElementById('current-file-path'),
      statusContainer: document.getElementById('status-badge-container'),
      selectStatus: document.getElementById('select-status'),
      editorActions: document.getElementById('editor-actions'),
      conflictAlert: document.getElementById('conflict-alert'),
      btnReloadConflict: document.getElementById('btn-reload-conflict'),
      editPane: document.getElementById('edit-pane'),
      previewPane: document.getElementById('preview-pane'),
      editor: document.getElementById('markdown-editor'),
      preview: document.getElementById('markdown-preview'),
      btnSave: document.getElementById('btn-save'),
      tagsCloud: document.getElementById('tags-cloud'),
      tagFilterView: document.getElementById('tag-filter-view'),
      currentTagName: document.getElementById('current-tag-name'),
      tagStatusPills: document.getElementById('tag-status-pills'),
      tagFilesList: document.getElementById('tag-files-list'),
      btnClearTag: document.getElementById('btn-clear-tag'),
      modalNewFile: document.getElementById('modal-new-file'),
      btnNewFile: document.getElementById('btn-new-file'),
      btnCloseModal: document.getElementById('btn-close-modal'),
      btnCancelCreate: document.getElementById('btn-cancel-create'),
      btnConfirmCreate: document.getElementById('btn-confirm-create'),
      inputNewPath: document.getElementById('input-new-path'),
      inputNewContent: document.getElementById('input-new-content'),
      viewEdit: document.getElementById('view-edit'),
      viewPreview: document.getElementById('view-preview'),
      viewSplit: document.getElementById('view-split')
    };

    // 初始化 Marked 渲染器
    marked.setOptions({
      highlight: function(code, lang) {
        if (lang && hljs.getLanguage(lang)) {
          return hljs.highlight(code, { language: lang }).value;
        }
        return hljs.highlightAuto(code).value;
      },
      breaks: true
    });

    // 自定义渲染：维基链接 [[Note]] 和 Dataview 代码块降级
    const renderer = new marked.Renderer();
    const origCode = renderer.code.bind(renderer);
    renderer.code = function(code, language) {
      if (language === 'dataview') {
        return `<div class="bg-purple-950/40 border border-purple-800/60 p-3 rounded my-2 text-xs font-mono text-purple-200">
                  <div class="text-[10px] text-purple-400 font-bold mb-1 flex items-center">
                    <span class="w-2 h-2 rounded-full bg-purple-500 mr-1.5 inline-block"></span>Obsidian Dataview 查询块（仅在 Obsidian 内执行动态计算）
                  </div>
                  <pre class="overflow-x-auto">${code}</pre>
                </div>`;
      }
      return origCode(code, language);
    };
    marked.use({ renderer });

    // API 请求封装
    async function api(path, opts = {}) {
      const res = await fetch('/api' + path, opts);
      if (!res.ok) {
        let errData = {};
        try { errData = await res.json(); } catch(e) {}
        const error = new Error(errData.detail || `HTTP ${res.status}`);
        error.status = res.status;
        error.detail = errData.detail;
        throw error;
      }
      return await res.json();
    }

    // 格式化维基链接与 .base 嵌入降级 (v0.2 §5)
    function renderWikiLinks(html) {
      // 1. .base 嵌入降级: ![[...base#锚点]]
      html = html.replace(/!\[\[([^\]]+\.base(?:#[^\]|]+)?)(?:\|([^\]]+))?\]\]/g, (match, baseTarget) => {
        return `<div class="bg-[#252233] border border-purple-900/60 p-2.5 rounded my-2 text-xs flex items-center justify-between text-purple-200 shadow-sm">
                  <div class="flex items-center space-x-2">
                    <span class="px-1.5 py-0.5 rounded bg-purple-950 text-purple-400 font-mono text-[10px] border border-purple-800/40">Obsidian Base Embed</span>
                    <span class="font-mono text-slate-300 text-[11px]">${baseTarget.trim()}</span>
                  </div>
                  <span class="text-[10px] text-purple-400 bg-purple-900/30 px-2 py-0.5 rounded border border-purple-800/30">Open in Obsidian</span>
                </div>`;
      });

      // 2. 普通维基链接: [[Note]] 或 [[Note|Alias]]
      return html.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (match, note, alias) => {
        const text = alias || note;
        return `<a href="javascript:void(0)" onclick="openByTitle('${note.trim()}')" class="wikilink">[[${text}]]</a>`;
      });
    }

    // 1. 加载配置与状态
    async function loadConfig() {
      try {
        const data = await api('/config');
        state.config = data;
        el.vaultPath.textContent = data.vault_path;
        el.statFiles.textContent = data.stats.files;
        el.statTags.textContent = data.stats.tags;
      } catch (err) {
        console.error('加载配置失败:', err);
      }
    }

    // 2. 加载并渲染文件树
    async function loadFileTree() {
      try {
        const root = await api('/files/tree');
        state.treeData = root;
        renderTree(root, el.treeContainer);
        lucide.createIcons();
      } catch (err) {
        el.treeContainer.innerHTML = `<div class="text-rose-400 p-2">加载文件树失败: ${err.message}</div>`;
      }
    }

    function renderTree(node, container, filter = '') {
      container.innerHTML = '';
      const list = document.createElement('div');
      list.className = 'space-y-0.5';

      function appendNode(item, parentEl, depth = 0) {
        if (item.type === 'dir') {
          // 文件夹
          const hasChildren = item.children && item.children.length > 0;
          if (!hasChildren) return;

          const dirWrapper = document.createElement('div');
          dirWrapper.className = 'select-none';

          const dirHeader = document.createElement('div');
          dirHeader.className = `flex items-center py-1 px-1.5 rounded hover:bg-[#282832] cursor-pointer text-slate-300 text-xs`;
          dirHeader.style.paddingLeft = `${depth * 14 + 6}px`;

          dirHeader.innerHTML = `
            <i data-lucide="chevron-right" class="w-3.5 h-3.5 mr-1 text-slate-500 transition-transform duration-150"></i>
            <i data-lucide="folder" class="w-3.5 h-3.5 mr-1.5 text-purple-400/80"></i>
            <span class="truncate font-medium">${item.name}</span>
          `;

          const childrenContainer = document.createElement('div');
          childrenContainer.className = 'hidden';

          dirHeader.addEventListener('click', () => {
            const isExpanded = !childrenContainer.classList.contains('hidden');
            childrenContainer.classList.toggle('hidden');
            const chevron = dirHeader.querySelector('[data-lucide="chevron-right"]');
            if (chevron) {
              chevron.style.transform = isExpanded ? 'rotate(0deg)' : 'rotate(90deg)';
            }
          });

          dirWrapper.appendChild(dirHeader);
          dirWrapper.appendChild(childrenContainer);
          parentEl.appendChild(dirWrapper);

          item.children.forEach(child => appendNode(child, childrenContainer, depth + 1));
        } else {
          // Markdown 文件
          if (filter && !item.filename.toLowerCase().includes(filter.toLowerCase())) {
            return;
          }
          const fileEl = document.createElement('div');
          const isCurrent = state.currentPath === item.path;
          fileEl.className = `flex items-center justify-between py-1 px-1.5 rounded hover:bg-[#2c2c38] cursor-pointer ${
            isCurrent ? 'bg-purple-900/40 text-purple-200 font-semibold' : 'text-slate-400 hover:text-slate-200'
          }`;
          fileEl.style.paddingLeft = `${depth * 14 + 18}px`;

          // 状态小圆点
          let statusBadge = '';
          const st = Array.isArray(item.statuses) ? item.statuses[0] : item.statuses;
          if (st === '进行中') statusBadge = '<span class="w-1.5 h-1.5 rounded-full bg-amber-400 mr-1.5"></span>';
          else if (st === '已完成') statusBadge = '<span class="w-1.5 h-1.5 rounded-full bg-emerald-400 mr-1.5"></span>';
          else if (st === '未开始') statusBadge = '<span class="w-1.5 h-1.5 rounded-full bg-slate-500 mr-1.5"></span>';

          fileEl.innerHTML = `
            <div class="flex items-center truncate mr-2">
              ${statusBadge}
              <span class="truncate">${item.title || item.filename}</span>
            </div>
            ${item.tags && item.tags.length ? `<span class="text-[10px] text-slate-500 bg-[#252530] px-1 rounded">#${item.tags[0]}</span>` : ''}
          `;

          fileEl.addEventListener('click', () => openFile(item.path));
          parentEl.appendChild(fileEl);
        }
      }

      node.children.forEach(child => appendNode(child, list));
      container.appendChild(list);
    }

    // 搜索文件
    el.fileSearch.addEventListener('input', (e) => {
      const q = e.target.value.trim();
      if (!state.treeData) return;
      if (!q) {
        renderTree(state.treeData, el.treeContainer);
      } else {
        // 展开平铺搜索
        const matches = [];
        function searchNode(n) {
          if (n.type === 'file') {
            if (n.filename.toLowerCase().includes(q.toLowerCase()) || (n.title && n.title.toLowerCase().includes(q.toLowerCase()))) {
              matches.push(n);
            }
          } else if (n.children) {
            n.children.forEach(searchNode);
          }
        }
        searchNode(state.treeData);
        el.treeContainer.innerHTML = '';
        const list = document.createElement('div');
        list.className = 'space-y-0.5';
        matches.forEach(item => {
          const row = document.createElement('div');
          row.className = 'p-1.5 rounded hover:bg-[#282832] cursor-pointer text-xs flex flex-col';
          row.innerHTML = `
            <div class="text-slate-200 font-medium truncate">${item.title || item.filename}</div>
            <div class="text-[10px] text-slate-500 truncate">${item.path}</div>
          `;
          row.addEventListener('click', () => openFile(item.path));
          list.appendChild(row);
        });
        el.treeContainer.appendChild(list);
      }
      lucide.createIcons();
    });

    // 3. 打开文件
    async function openFile(path) {
      try {
        el.conflictAlert.classList.add('hidden');
        const data = await api(`/file/content?path=${encodeURIComponent(path)}`);
        state.currentPath = data.path;
        state.currentHash = data.hash;
        state.currentRaw = data.raw;
        
        el.currentFilePath.textContent = data.path;
        el.editor.value = data.raw;
        el.editorActions.classList.remove('hidden');
        el.statusContainer.classList.remove('hidden');

        // 设置当前状态
        const st = Array.isArray(data.statuses) && data.statuses.length ? data.statuses[0] : (data.statuses || '未整理');
        state.currentStatus = st;
        el.selectStatus.value = st;

        updatePreview();
        loadFileTree(); // 刷新高亮
      } catch (err) {
        alert(`打开文件失败: ${err.message}`);
      }
    }

    // 通过 WikiLink 标题打开对应文件
    function openByTitle(title) {
      if (!state.treeData) return;
      let target = null;
      function findByTitle(n) {
        if (target) return;
        if (n.type === 'file') {
          if (n.title === title || n.filename === title || n.filename === `${title}.md`) {
            target = n;
          }
        } else if (n.children) {
          n.children.forEach(findByTitle);
        }
      }
      findByTitle(state.treeData);
      if (target) {
        openFile(target.path);
      } else {
        alert(`知识库中未找到名为 [[${title}]] 的已索引笔记`);
      }
    }

    // 4. 更新预览区
    function updatePreview() {
      const raw = el.editor.value;
      // 提取 frontmatter 与 正文
      let content = raw;
      if (raw.startsWith('---')) {
        const end = raw.indexOf('---', 3);
        if (end !== -1) {
          content = raw.substring(end + 3).trim();
        }
      }
      let html = marked.parse(content);
      html = renderWikiLinks(html);
      el.preview.innerHTML = html;
    }

    el.editor.addEventListener('input', () => {
      if (state.viewMode !== 'edit') {
        updatePreview();
      }
    });

    // 5. 保存文件 (支持 409 乐观锁处理)
    async function saveFile() {
      if (!state.currentPath) return;
      try {
        const content = el.editor.value;
        await api('/file/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            path: state.currentPath,
            content: content,
            expected_hash: state.currentHash
          })
        });

        // 保存成功后立即获取最新 snapshot hash
        const fresh = await api(`/file/content?path=${encodeURIComponent(state.currentPath)}`);
        state.currentHash = fresh.hash;
        el.conflictAlert.classList.add('hidden');

        // 闪烁保存提示
        el.btnSave.classList.remove('bg-emerald-600');
        el.btnSave.classList.add('bg-purple-600');
        el.btnSave.innerHTML = `<i data-lucide="check" class="w-3.5 h-3.5 mr-1"></i>已保存`;
        lucide.createIcons();
        setTimeout(() => {
          el.btnSave.classList.remove('bg-purple-600');
          el.btnSave.classList.add('bg-emerald-600');
          el.btnSave.innerHTML = `<i data-lucide="save" class="w-3.5 h-3.5 mr-1"></i>保存 (⌘S)`;
          lucide.createIcons();
        }, 1200);

      } catch (err) {
        if (err.status === 409) {
          // 409 冲突：外部修改
          el.conflictAlert.classList.remove('hidden');
          lucide.createIcons();
        } else {
          alert(`保存失败: ${err.message}`);
        }
      }
    }

    el.btnSave.addEventListener('click', saveFile);
    el.btnReloadConflict.addEventListener('click', () => {
      if (state.currentPath) openFile(state.currentPath);
    });

    // 快捷键 ⌘S / Ctrl+S 保存
    window.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 's') {
        e.preventDefault();
        saveFile();
      }
    });

    // 6. 快捷切换状态
    el.selectStatus.addEventListener('change', async (e) => {
      const newStatus = e.target.value;
      if (!state.currentPath) return;
      try {
        await api('/file/status', {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            path: state.currentPath,
            status: newStatus,
            expected_hash: state.currentHash
          })
        });
        // 重新拉取新内容与 hash
        await openFile(state.currentPath);
        loadTags(); // 刷新标签面板统计
      } catch (err) {
        alert(`修改状态失败: ${err.message}`);
        el.selectStatus.value = state.currentStatus;
      }
    });

    // 7. 加载标签中心与热度
    async function loadTags() {
      try {
        const data = await api('/tags');
        el.tagsCloud.innerHTML = '';
        data.tags.slice(0, 45).forEach(t => {
          const pill = document.createElement('button');
          pill.className = 'text-xs bg-[#282834] hover:bg-purple-900/60 text-slate-300 hover:text-purple-200 px-2.5 py-1 rounded-full border border-[#373748] flex items-center transition';
          pill.innerHTML = `
            <span>#${t.tag}</span>
            <span class="ml-1 text-[10px] text-slate-500 font-mono">(${t.count})</span>
          `;
          pill.addEventListener('click', () => selectTag(t.tag));
          el.tagsCloud.appendChild(pill);
        });
      } catch (err) {
        el.tagsCloud.innerHTML = `<div class="text-rose-400 text-xs">加载标签失败: ${err.message}</div>`;
      }
    }

    // 8. 选中标签，查看状态分布与文件列表
    async function selectTag(tagName) {
      state.activeTag = tagName;
      el.tagFilterView.classList.remove('hidden');
      el.currentTagName.textContent = `#${tagName}`;
      el.tagStatusPills.innerHTML = '<span class="text-slate-500 text-[10px]">分析中...</span>';
      el.tagFilesList.innerHTML = '';

      try {
        const data = await api(`/files/by-tag?tag=${encodeURIComponent(tagName)}`);
        
        // 状态小徽章
        el.tagStatusPills.innerHTML = '';
        Object.entries(data.groups).forEach(([stName, list]) => {
          const span = document.createElement('span');
          span.className = 'text-[10px] px-2 py-0.5 rounded bg-[#333342] text-slate-300 border border-[#444455]';
          span.textContent = `${stName}: ${list.length}`;
          el.tagStatusPills.appendChild(span);
        });

        // 文件列表
        el.tagFilesList.innerHTML = '';
        Object.entries(data.groups).forEach(([stName, list]) => {
          list.forEach(file => {
            const row = document.createElement('div');
            row.className = 'p-1.5 bg-[#1e1e24] hover:bg-purple-950/60 rounded border border-[#2e2e3a] cursor-pointer flex items-center justify-between';
            row.innerHTML = `
              <div class="truncate text-slate-200 font-medium">${file.title || file.filename}</div>
              <span class="text-[9px] text-purple-400 bg-purple-900/30 px-1 rounded shrink-0 ml-1">${stName}</span>
            `;
            row.addEventListener('click', () => openFile(file.path));
            el.tagFilesList.appendChild(row);
          });
        });

      } catch (err) {
        el.tagFilesList.innerHTML = `<div class="text-rose-400 text-[10px]">加载标签失败: ${err.message}</div>`;
      }
    }

    el.btnClearTag.addEventListener('click', () => {
      state.activeTag = null;
      el.tagFilterView.classList.add('hidden');
    });

    // 9. 视图切换（Edit / Preview / Split）
    function setView(mode) {
      state.viewMode = mode;
      [el.viewEdit, el.viewPreview, el.viewSplit].forEach(btn => {
        btn.classList.remove('bg-purple-600', 'text-white');
        btn.classList.add('text-slate-400');
      });

      if (mode === 'edit') {
        el.viewEdit.classList.add('bg-purple-600', 'text-white');
        el.editPane.classList.remove('hidden');
        el.previewPane.classList.add('hidden');
      } else if (mode === 'preview') {
        el.viewPreview.classList.add('bg-purple-600', 'text-white');
        el.editPane.classList.add('hidden');
        el.previewPane.classList.remove('hidden');
        updatePreview();
      } else {
        el.viewSplit.classList.add('bg-purple-600', 'text-white');
        el.editPane.classList.remove('hidden');
        el.previewPane.classList.remove('hidden');
        updatePreview();
      }
    }

    el.viewEdit.addEventListener('click', () => setView('edit'));
    el.viewPreview.addEventListener('click', () => setView('preview'));
    el.viewSplit.addEventListener('click', () => setView('split'));

    // 10. 新建笔记 Modal（模板创建 + 空白创建）
    let activeCreateTab = 'tpl'; // 'tpl' | 'blank'
    let loadedTemplates = [];

    const tabCreateTpl = document.getElementById('tab-create-tpl');
    const tabCreateBlank = document.getElementById('tab-create-blank');
    const viewTplCreate = document.getElementById('view-tpl-create');
    const viewBlankCreate = document.getElementById('view-blank-create');
    const selectTemplate = document.getElementById('select-template');
    const inputTplTitle = document.getElementById('input-tpl-title');
    const tplSuggestedPath = document.getElementById('tpl-suggested-path');
    const tplJsWarning = document.getElementById('tpl-js-warning');

    tabCreateTpl.addEventListener('click', () => {
      activeCreateTab = 'tpl';
      tabCreateTpl.className = 'pb-2 px-3 border-b-2 border-purple-500 text-purple-300 font-semibold flex items-center';
      tabCreateBlank.className = 'pb-2 px-3 text-slate-400 hover:text-slate-200 flex items-center';
      viewTplCreate.classList.remove('hidden');
      viewBlankCreate.classList.add('hidden');
    });

    tabCreateBlank.addEventListener('click', () => {
      activeCreateTab = 'blank';
      tabCreateBlank.className = 'pb-2 px-3 border-b-2 border-purple-500 text-purple-300 font-semibold flex items-center';
      tabCreateTpl.className = 'pb-2 px-3 text-slate-400 hover:text-slate-200 flex items-center';
      viewBlankCreate.classList.remove('hidden');
      viewTplCreate.classList.add('hidden');
    });

    async function loadTemplatesList() {
      try {
        const data = await api('/templates');
        loadedTemplates = data.templates;
        selectTemplate.innerHTML = '';
        data.templates.forEach(t => {
          const opt = document.createElement('option');
          opt.value = t.path;
          opt.textContent = `${t.name} ${t.has_js_block ? '⚡(含JS)' : ''} ${t.has_file_move ? '↪(带自动落位)' : ''}`;
          selectTemplate.appendChild(opt);
        });
        updateTemplateSuggestion();
      } catch (err) {
        console.error('加载模板列表失败:', err);
      }
    }

    async function updateTemplateSuggestion() {
      const tplPath = selectTemplate.value;
      const title = inputTplTitle.value.trim() || '未命名笔记';
      if (!tplPath) return;
      const selected = loadedTemplates.find(t => t.path === tplPath);
      if (selected && selected.has_js_block) {
        tplJsWarning.classList.remove('hidden');
      } else {
        tplJsWarning.classList.add('hidden');
      }

      try {
        const prev = await api(`/template/preview?path=${encodeURIComponent(tplPath)}&title=${encodeURIComponent(title)}`);
        tplSuggestedPath.textContent = prev.suggested_path;
      } catch(e) {
        tplSuggestedPath.textContent = `${title}.md`;
      }
    }

    selectTemplate.addEventListener('change', updateTemplateSuggestion);
    inputTplTitle.addEventListener('input', updateTemplateSuggestion);

    el.btnNewFile.addEventListener('click', async () => {
      el.modalNewFile.classList.remove('hidden');
      el.modalNewFile.classList.add('flex');
      if (loadedTemplates.length === 0) {
        await loadTemplatesList();
      } else {
        updateTemplateSuggestion();
      }
      inputTplTitle.focus();
    });

    const closeModal = () => {
      el.modalNewFile.classList.add('hidden');
      el.modalNewFile.classList.remove('flex');
    };
    el.btnCloseModal.addEventListener('click', closeModal);
    el.btnCancelCreate.addEventListener('click', closeModal);

    el.btnConfirmCreate.addEventListener('click', async () => {
      if (activeCreateTab === 'tpl') {
        const tplPath = selectTemplate.value;
        const title = inputTplTitle.value.trim();
        if (!title) {
          alert('请输入笔记标题');
          inputTplTitle.focus();
          return;
        }
        try {
          const ret = await api('/file/create-with-template', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              template_path: tplPath,
              title: title
            })
          });
          closeModal();
          await loadFileTree();
          await openFile(ret.path);
        } catch (err) {
          alert(`模板创建失败: ${err.message}`);
        }
      } else {
        const path = el.inputNewPath.value.trim();
        const content = el.inputNewContent.value;
        if (!path) {
          alert('请输入目标文件路径');
          return;
        }
        try {
          await api('/file/create', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ path, content })
          });
          closeModal();
          await loadFileTree();
          await openFile(path);
        } catch (err) {
          alert(`创建失败: ${err.message}`);
        }
      }
    });

    // 页面初始化入口
    async function init() {
      await loadConfig();
      await loadFileTree();
      await loadTags();
      loadTemplatesList(); // 预拉取模板
      setView('split');
      lucide.createIcons();
    }

    init();
  </script>
</body>
</html>
