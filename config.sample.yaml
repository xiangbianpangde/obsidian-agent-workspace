# Sample 演示配置（用于无须真实 Vault 的一键开源复现）
vault:
  path: ./sample-vault

templates:
  dir: 资料库/模版

index:
  database: ./data/sample_vault.db

security:
  bind_host: 127.0.0.1
  scan_exclude:
    - .obsidian
    - .claudian
    - .codex
    - .hermes
    - .claude
    - copilot
    - .trash
    - 附件
    - credentials
    - .git
    - __pycache__
    - node_modules
    - .venv
  reject_symlink_escape: true

watchdog:
  enabled: true
  debounce_ms: 500

server:
  port: 8787
